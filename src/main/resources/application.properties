## -- Report exports (DccPOV2Controller / DccPOController job-based exports)
app.export.dir=/data/app/logs/ALM/Exports/
## how long a finished (DONE/FAILED) export job's file + record are kept before cleanup removes them
app.export.retention-hours=48
## how long a job can sit PENDING/RUNNING before cleanup force-marks it FAILED (covers e.g. an app redeploy mid-export)
app.export.stuck-threshold-hours=2