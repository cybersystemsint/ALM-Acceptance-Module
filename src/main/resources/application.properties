# Do NOT let Hibernate auto-create tables on startup in this environment
spring.jpa.hibernate.ddl-auto=none

## -- Report exports (ExportsController / ExportJobCleanupService)
app.export.dir=/data/app/logs/ALM/Exports/
## how long a finished (DONE/FAILED) export job's file + DB row are kept before cleanup removes them
app.export.retention-hours=48
## how long a job can sit PENDING/RUNNING before cleanup assumes it's stuck/orphaned and marks it FAILED
app.export.stuck-threshold-hours=2